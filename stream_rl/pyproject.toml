[project]
name = "stream-rl"
version = "0.1.0"
description = "Streaming and recurrent reinforcement learning for long-term memory benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "lox",
    "memorax",
    "numpy>=2.5.1",
    "popgym>=1.0.7",
    "pyyaml>=6.0.3",
    "rl-zoo3>=2.9.1",
    "streamlit>=1.60.0",
    "torch==2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
memorax = { git = "https://github.com/noahfarr/memorax.git", rev = "94dd21dba5ab6eee4a0281066a5f49643d052174" }
lox = { git = "https://github.com/huterguier/lox", rev = "c096510899bd9a5be547bf680c55a4d8d6fc6b56" }
popjym = { git = "https://github.com/EdanToledo/popjym" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["stream_rl", "stream_rl.src", "stream_rl.src.models"]
