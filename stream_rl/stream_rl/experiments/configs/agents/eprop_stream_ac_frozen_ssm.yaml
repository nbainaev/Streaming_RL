name: stream_eprop
device: cpu

# Frozen input projection + pretrained frozen SSM; e-propGRU and heads learn.
frozen_ssm: true
frozen_encoder: true
frozen_ssm_checkpoint: stream_rl/experiments/checkpoints/frozen_ssm_delayed_recall.npz
memory_seed: 220512258
critic_memory_seed: 220512258
ssm_features: 64
ssm_state_dim: 128
ssm_concatenate_input: true

num_envs: 1
embed_dim: 64
hidden_size: 64
cell: eprop_gru
activation: tanh
gamma: 0.99
trace_decay: 0.9
trace_lambda: 0.9
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 0.2
critic_kappa: 0.5
entropy_coefficient: 0.01
adaptive: false
feedback_mode: symmetric
feedback_seed: 0
feedback_lr: 0.05
use_layernorm: true
use_sparse_init: true
sparsity: 0.9
