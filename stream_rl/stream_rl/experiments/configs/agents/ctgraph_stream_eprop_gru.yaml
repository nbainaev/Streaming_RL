name: stream_eprop
device: cpu

num_envs: 4
embed_dim: 32
hidden_size: 32
cell: eprop_gru
activation: tanh

gamma: 0.99
trace_decay: 0.9
trace_lambda: 0.9
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 0.2
critic_kappa: 0.5
entropy_coefficient: 0.02
adaptive: false

feedback_mode: symmetric
feedback_seed: 0
feedback_lr: 0.05
use_layernorm: true
use_sparse_init: true
sparsity: 0.9
