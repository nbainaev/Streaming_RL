name: stream_ac
device: cpu
embed_dim: 64
num_envs: 1
gamma: 0.99
trace_lambda: 0.95
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 0.2
critic_kappa: 0.5
entropy_coefficient: 0.01
adaptive: false
direct_entropy_update: false
tbptt_steps: 1
rtrl_scope: single_layer_exact

actor_architecture:
  - type: rnn
    cell: rtu_rtrl
    features: 64
    r_min: 0.0
    r_max: 0.99
  - type: layernorm
  - type: fc
    features: -1
    init: sparse

critic_architecture:
  - type: rnn
    cell: rtu_rtrl
    features: 64
    r_min: 0.0
    r_max: 0.99
  - type: layernorm
  - type: fc
    features: -1
    init: sparse
