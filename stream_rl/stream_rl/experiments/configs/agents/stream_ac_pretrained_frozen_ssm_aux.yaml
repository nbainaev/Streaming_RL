critic_memory_seed: 220512258
embed_dim: 64
auxiliary_cue_coefficient: 0.2
auxiliary_cue_lr: 0.05
auxiliary_cue_kappa: 1.0
auxiliary_readout_dim: 32
num_envs: 1
gamma: 0.99
trace_lambda: 0.9
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 0.2
critic_kappa: 0.5
entropy_coefficient: 0.01
adaptive: false
