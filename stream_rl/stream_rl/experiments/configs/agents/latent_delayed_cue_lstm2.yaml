name: stream_ac
device: cpu

embed_dim: 32
num_envs: 16
gamma: 1.0
trace_lambda: 0.99
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 3.0
critic_kappa: 2.0
entropy_coefficient: 0.01
adaptive: false
tbptt_steps: 1

actor_architecture:
  - type: rnn
    cell: lstm
    features: 32
  - type: layernorm
  - type: rnn
    cell: lstm
    features: 32
  - type: layernorm
  - type: fc
    features: -1
    init: sparse

critic_architecture:
  - type: rnn
    cell: lstm
    features: 32
  - type: layernorm
  - type: rnn
    cell: lstm
    features: 32
  - type: layernorm
  - type: fc
    features: -1
    init: sparse
