name: ppo
device: cpu

embed_dim: 32
num_envs: 1
num_steps: 128
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 1
update_epochs: 4
normalize_advantage: true
clip_coefficient: 0.2
clip_value_loss: true
entropy_coefficient: 0.02
actor_lr: 3.0e-4
critic_lr: 3.0e-4
max_grad_norm: 0.5

actor_architecture:
  - type: rnn
    cell: gru
    features: 32
  - type: layernorm
  - type: fc
    features: -1
    init: sparse

critic_architecture:
  - type: rnn
    cell: gru
    features: 32
  - type: layernorm
  - type: fc
    features: -1
    init: sparse
