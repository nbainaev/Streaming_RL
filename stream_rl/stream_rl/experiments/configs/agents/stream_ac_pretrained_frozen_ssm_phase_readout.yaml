name: stream_ac
device: cpu

# The already-observed position bit is preserved as encoder channel 0.  It
# gates two trainable readouts while the pretrained SSM remains frozen.
readout_only: true
preserve_observation_prefix: 1
memory_seed: 220512258
critic_memory_seed: 220512258
embed_dim: 64
num_envs: 1
gamma: 0.99
trace_lambda: 0.9
actor_lr: 0.1
critic_lr: 0.3
actor_kappa: 3.0
critic_kappa: 2.0
entropy_coefficient: 0.003
adaptive: false
direct_entropy_update: true
tbptt_steps: 1

actor_architecture:
  - type: frozen_ssm
    features: 64
    state_dim: 128
    concatenate_input: true
    checkpoint_path: stream_rl/experiments/checkpoints/frozen_ssm_delayed_recall.npz
  - type: gated_readout
    features: -1
    split_index: 64
    fixed_gate_index: 0
    navigation_prefix: 1

critic_architecture:
  - type: frozen_ssm
    features: 64
    state_dim: 128
    concatenate_input: true
    checkpoint_path: stream_rl/experiments/checkpoints/frozen_ssm_delayed_recall.npz
  - type: gated_readout
    features: -1
    split_index: 64
    fixed_gate_index: 0
    navigation_prefix: 1
