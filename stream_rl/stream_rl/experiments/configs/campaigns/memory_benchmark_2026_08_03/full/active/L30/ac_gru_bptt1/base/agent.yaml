name: stream_ac
device: cpu
embed_dim: 64
num_envs: 1
gamma: 0.99
trace_lambda: 0.9
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 0.2
critic_kappa: 0.5
entropy_coefficient: 0.01
adaptive: true
tbptt_steps: 1
actor_architecture:
- type: rnn
  cell: gru
  features: 64
- type: layernorm
- type: fc
  features: -1
  init: sparse
critic_architecture:
- type: rnn
  cell: gru
  features: 64
- type: layernorm
- type: fc
  features: -1
  init: sparse
