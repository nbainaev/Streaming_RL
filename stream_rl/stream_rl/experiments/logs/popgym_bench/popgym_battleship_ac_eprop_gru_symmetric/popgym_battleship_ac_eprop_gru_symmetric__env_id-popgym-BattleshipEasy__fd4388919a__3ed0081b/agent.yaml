name: stream_eprop
device: cpu
num_envs: 1
embed_dim: 64
hidden_size: 64
cell: eprop_gru
activation: tanh
gamma: 0.99
trace_decay: 0.9
trace_lambda: 0.95
actor_lr: 1.0
critic_lr: 1.0
actor_kappa: 0.2
critic_kappa: 0.5
entropy_coefficient: 0.01
adaptive: true
feedback_mode: symmetric
feedback_seed: 0
feedback_lr: 0.05
